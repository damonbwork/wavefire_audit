<svg viewBox="0 0 1400 1040" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39618b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrowTealDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGrayDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="1040" fill="#f8fafc"/>

  <!-- Title -->
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Wavefire Data Model — One Risk, Many Audits, and How Controls Map In</text>
  <text x="700" y="55" text-anchor="middle" font-size="12" fill="#64748b">A single Risk can be in scope for many Audits, and is mitigated by many Controls — each Control can itself map to Workpapers directly, or to an Audit directly</text>

  <!-- ================= CENTER: RISK ================= -->
  <rect x="560" y="455" width="280" height="96" rx="12" fill="#7c3aed"/>
  <text x="700" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RISK</text>
  <text x="700" y="508" text-anchor="middle" font-size="10.5" fill="#ede9fe">e.g. "Unauthorized changes to</text>
  <text x="700" y="522" text-anchor="middle" font-size="10.5" fill="#ede9fe">production systems go undetected"</text>
  <text x="700" y="540" text-anchor="middle" font-size="10.5" fill="#ddd6fe">(from the Foundations RCM library)</text>

  <!-- ================= AUDIT <-> RISK (many-to-many) ================= -->
  <rect x="600" y="60" width="200" height="58" rx="10" fill="#274e77"/>
  <text x="700" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">AUDIT A</text>
  <text x="700" y="102" text-anchor="middle" font-size="9.5" fill="#cbd5e1">FY26 SOX Audit</text>

  <rect x="90" y="838" width="200" height="58" rx="10" fill="#274e77"/>
  <text x="190" y="863" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">AUDIT B</text>
  <text x="190" y="880" text-anchor="middle" font-size="9.5" fill="#cbd5e1">Vendor Risk Audit</text>

  <rect x="1110" y="838" width="200" height="58" rx="10" fill="#274e77"/>
  <text x="1210" y="863" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">AUDIT C</text>
  <text x="1210" y="880" text-anchor="middle" font-size="9.5" fill="#cbd5e1">IT General Controls</text>

  <line x1="700" y1="118" x2="700" y2="453" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
  <line x1="255" y1="845" x2="605" y2="540" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
  <line x1="1145" y1="845" x2="835" y2="540" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>

  <text x="700" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">many-to-many</text>
  <text x="700" y="314" text-anchor="middle" font-size="10" fill="#9a3412">(a Risk can be in scope for several Audits,</text>
  <text x="700" y="327" text-anchor="middle" font-size="10" fill="#9a3412">and an Audit typically covers several Risks)</text>

  <!-- ================= AUDIT -> WORKPAPER (one-to-many) ================= -->
  <rect x="370" y="55" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="445" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper A1</text>
  <text x="445" y="91" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit A)</text>
  <line x1="600" y1="82" x2="524" y2="79" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <rect x="880" y="55" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="955" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper A2</text>
  <text x="955" y="91" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit A)</text>
  <line x1="800" y1="82" x2="876" y2="79" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <rect x="20" y="928" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="95" y="949" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper B1</text>
  <text x="95" y="964" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit B)</text>
  <line x1="150" y1="896" x2="115" y2="926" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <rect x="200" y="928" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="275" y="949" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper B2</text>
  <text x="275" y="964" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit B)</text>
  <line x1="230" y1="896" x2="265" y2="926" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <rect x="1050" y="928" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="1125" y="949" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper C1</text>
  <text x="1125" y="964" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit C)</text>
  <line x1="1170" y1="896" x2="1140" y2="926" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <rect x="1230" y="928" width="150" height="48" rx="8" fill="#39618b"/>
  <text x="1305" y="949" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Workpaper C2</text>
  <text x="1305" y="964" text-anchor="middle" font-size="9" fill="#dbeafe">(under Audit C)</text>
  <line x1="1250" y1="896" x2="1290" y2="926" stroke="#39618b" stroke-width="2" marker-end="url(#arrowNavy)"/>

  <!-- ================= CONTROLS -> RISK (mitigates) ================= -->
  <rect x="130" y="440" width="170" height="54" rx="10" fill="#a78bfa"/>
  <text x="215" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#3b0764">CONTROL 1</text>
  <text x="215" y="478" text-anchor="middle" font-size="9" fill="#4c1d95">Change approval gate</text>
  <line x1="300" y1="475" x2="556" y2="490" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrowViolet)"/>

  <rect x="130" y="520" width="170" height="54" rx="10" fill="#a78bfa"/>
  <text x="215" y="542" text-anchor="middle" font-size="12" font-weight="700" fill="#3b0764">CONTROL 2</text>
  <text x="215" y="558" text-anchor="middle" font-size="9" fill="#4c1d95">Access review (quarterly)</text>
  <line x1="300" y1="548" x2="556" y2="520" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrowViolet)"/>

  <rect x="1100" y="480" width="170" height="54" rx="10" fill="#a78bfa"/>
  <text x="1185" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#3b0764">CONTROL 3</text>
  <text x="1185" y="518" text-anchor="middle" font-size="9" fill="#4c1d95">Change log monitoring</text>
  <line x1="1100" y1="507" x2="844" y2="500" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrowViolet)"/>

  <text x="480" y="415" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">mitigates</text>
  <text x="960" y="465" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">mitigates</text>

  <!-- ================= CONTROL -> WORKPAPER (direct, many-to-many) ================= -->
  <path d="M215,440 C 260,330 350,180 400,105" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowTealDash)"/>
  <path d="M215,574 C 200,700 150,830 110,926" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowTealDash)"/>

  <!-- ================= CONTROL -> AUDIT (direct, separate from workpaper linkage) ================= -->
  <path d="M1185,480 C 1195,400 1200,300 1200,180 C 1200,150 1150,125 1085,110" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGrayDash)"/>

  <text x="330" y="700" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">Controls also link directly to Workpapers</text>
  <text x="330" y="716" text-anchor="middle" font-size="9.5" fill="#0f766e">(tested there — many-to-many)</text>

  <text x="1200" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">A Control can also link</text>
  <text x="1200" y="256" text-anchor="middle" font-size="9.5" fill="#475569">directly to an Audit</text>
  <text x="1200" y="270" text-anchor="middle" font-size="9.5" fill="#475569">(audit-level scoping, separate</text>
  <text x="1200" y="284" text-anchor="middle" font-size="9.5" fill="#475569">from any one Workpaper's own link)</text>

  <!-- ================= LEGEND (centered in the open space below Risk,
       clear of both Audit B/C's zones and the annotation text above) ================= -->
  <rect x="450" y="600" width="500" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="10.5" fill="#475569">
    <line x1="470" y1="625" x2="490" y2="625" stroke="#39618b" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
    <text x="498" y="629">Audit → Workpaper — one-to-many (core hierarchy)</text>

    <line x1="470" y1="653" x2="490" y2="653" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
    <text x="498" y="657">Audit ↔ Risk — many-to-many</text>

    <line x1="470" y1="681" x2="490" y2="681" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
    <text x="498" y="685">Control → Risk — "mitigates" (many Controls can mitigate one Risk)</text>

    <line x1="470" y1="709" x2="490" y2="709" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowTealDash)"/>
    <text x="498" y="713">Control → Workpaper — direct, many-to-many (where the Control is actually tested)</text>

    <line x1="470" y1="737" x2="490" y2="737" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGrayDash)"/>
    <text x="498" y="741">Control → Audit — direct, many-to-many (audit-level linkage, distinct from any Workpaper's own)</text>

    <text x="700" y="768" text-anchor="middle" font-size="9.5" font-style="italic" fill="#94a3b8">All relationships shown are illustrative of the real data model — actual counts vary per audit.</text>
  </g>

  <text x="1360" y="1020" text-anchor="end" font-size="9.5" fill="#94a3b8">Wavefire — risk-centered relationship view</text>
</svg>
